services:
  database:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file:
      - path: .env.production
        format: raw
    volumes: ["dhis2_database:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_locks_per_transaction=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
  dhis2:
    image: dhis2/core:2.42.5.1
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1536m"
    depends_on:
      database:
        condition: service_healthy
    volumes: ["./deploy/dhis2_home/dhis.conf:/opt/dhis2/dhis.conf:ro"]
    expose: ["8080"]
    mem_limit: 2200m
    security_opt: ["no-new-privileges:true"]
  api:
    build: .
    restart: unless-stopped
    environment:
      ONEHEALTH_DATA_PATH: /app/data/processed/dengue_weekly.csv
      DHIS2_MAPPING_PATH: /app/dhis2/mappings/dengue.json
    env_file:
      - path: .env.production
        format: raw
    expose: ["8000"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    expose: ["8080"]
    read_only: true
    tmpfs:
      - "/var/cache/nginx:uid=101,gid=101,mode=0700"
      - "/tmp:uid=101,gid=101,mode=0700"
    security_opt: ["no-new-privileges:true"]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, dhis2]
    env_file:
      - path: .env.production
        format: raw
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
volumes:
  dhis2_database:
  caddy_data:
  caddy_config:
