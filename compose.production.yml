services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    expose: ["8000"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    expose: ["8080"]
    read_only: true
    tmpfs: ["/var/cache/nginx"]
    security_opt: ["no-new-privileges:true"]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    environment:
      ONEHEALTH_DOMAIN: ${ONEHEALTH_DOMAIN:?Set ONEHEALTH_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
volumes:
  caddy_data:
  caddy_config:
